name: Source installation

on:
  push:
    branches: [main, 'feat/alpha-hardening']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Create clean source archive
        run: git archive --format=zip --output=source.zip HEAD
      - name: Upload source for reproducible review
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: source.zip
          retention-days: 7
      - name: Install as a new user
        run: |
          python -m pip install .
          cd /tmp
          codex-recall --help
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
